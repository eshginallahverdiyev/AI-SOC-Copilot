name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate workflows
        run: npm run validate
      - name: Secret and personal-data scan
        run: npm run scan
      - name: Prompt documentation is up to date
        run: npm run prompts:check
      - name: Offline tests for Code nodes
        run: npm test
